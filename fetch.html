<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch</title>
</head>
<body>
    <!-- 목록이 출력될 영역 -->
    <div id="result"></div>

    <script>
        // [1] 재사용 가능한 비동기 함수: 주어진 URL로 GET 요청을 보내고 JSON 데이터를 반환한다.
        async function fetchJson(url) {
            // fetch로 요청을 보내고 응답(Response)이 올 때까지 await로 기다린다.
            const response = await fetch(url);
            // HTTP 상태 코드가 200번대가 아니면(response.ok === false) 에러를 발생시킨다.
            if (!response.ok) {
                throw new Error(`요청 실패: ${response.status}`);
            }
            // 응답 본문을 JSON으로 파싱하여 JavaScript 객체/배열로 반환한다.
            return await response.json();
        }

        // [2] 재사용 가능한 렌더링 함수: 사용자 배열을 ul/li 목록으로 만들어 지정한 요소에 출력한다.
        function renderUserList(users, container) {
            // ul 요소를 생성한다.
            const ul = document.createElement('ul');
            // 사용자 배열을 순회하며 각 사용자마다 li 요소를 만든다.
            users.forEach(({ address }) => {
                const li = document.createElement('li');
                // li에 우편번호(zipcode)만 텍스트로 넣는다. (textContent로 XSS 방지)
                li.textContent = address.zipcode;
                // 완성된 li를 ul에 추가한다.
                ul.appendChild(li);
            });
            // 완성된 ul을 화면(컨테이너)에 추가한다.
            container.appendChild(ul);
        }

        // [3] 메인 비동기 함수: 데이터 요청 → 화면 출력 순서로 실행하고 에러를 처리한다.
        async function main() {
            // 출력 대상 요소를 가져온다.
            const container = document.getElementById('result');
            try {
                // 사용자 목록 API에 요청하고 결과를 기다린다.
                const users = await fetchJson('https://jsonplaceholder.typicode.com/users');
                // 받아온 데이터를 목록으로 화면에 출력한다.
                renderUserList(users, container);
            } catch (error) {
                // 네트워크/응답 에러 발생 시 화면에 메시지를 표시한다.
                container.textContent = `에러 발생: ${error.message}`;
            }
        }

        // [4] 페이지가 로드되면 main 함수를 실행한다.
        main();
    </script>
</body>
</html>
